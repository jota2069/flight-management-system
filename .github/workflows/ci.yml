name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOTNET_NUGET_SIGNATURE_VERIFICATION: "true"
      # Ephemeral CI-only PostgreSQL; never reused for application data.
      FLIGHT_TEST_ADMIN_CONNECTION: Host=localhost;Port=5432;Database=postgres;Username=postgres

    steps:
      - name: Получение кода репозитория
        uses: actions/checkout@v4

      - name: Установка .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Восстановление зависимостей
        run: dotnet restore

      - name: Сборка проекта
        run: dotnet build --no-restore --configuration Release

      - name: Запуск тестов
        run: dotnet test --no-build --configuration Release --verbosity normal
